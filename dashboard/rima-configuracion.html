<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIMA — Configuración</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#0A0A0F;color:#F1F5F9}
    .glass{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07)}
    .f-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:9px 12px;font-size:12px;color:#F1F5F9;outline:none}
    .btn-p{background:linear-gradient(135deg,#7C3AED,#6D28D9);color:#fff;font-size:11px;font-weight:600;padding:9px 16px;border-radius:10px;border:none;cursor:pointer}
  </style>
</head>
<body class="flex h-screen overflow-hidden">

<aside id="rima-sidebar"></aside>

<main class="flex-1 flex flex-col overflow-hidden">
  <div class="px-6 py-5 border-b border-white/5">
    <h1 class="text-sm font-semibold text-white">Configuración</h1>
    <p class="text-[11px] text-slate-500 mt-0.5">Cuenta, plan y seguridad</p>
  </div>

  <div class="flex-1 overflow-y-auto p-6 space-y-4 max-w-lg">
    <div class="glass rounded-2xl p-5">
      <p class="text-[9px] uppercase tracking-widest text-slate-600 font-bold mb-3">Tu cuenta</p>
      <div class="space-y-2 text-[12px]">
        <div class="flex justify-between gap-4"><span class="text-slate-500">Nombre</span><span id="cfg-name" class="text-white font-medium">—</span></div>
        <div class="flex justify-between gap-4"><span class="text-slate-500">Email</span><span id="cfg-email" class="text-white font-medium truncate">—</span></div>
        <div class="flex justify-between gap-4"><span class="text-slate-500">Plan</span><span id="cfg-plan" class="text-violet-300 font-semibold">—</span></div>
        <div class="flex justify-between gap-4"><span class="text-slate-500">Negocio</span><span id="cfg-brand" class="text-white font-medium">—</span></div>
      </div>
    </div>

    <div class="glass rounded-2xl p-5">
      <p class="text-[9px] uppercase tracking-widest text-slate-600 font-bold mb-3">Cambiar contraseña</p>
      <div class="space-y-2">
        <input type="password" id="pw-cur" class="f-input" placeholder="Contraseña actual" />
        <input type="password" id="pw-new" class="f-input" placeholder="Nueva (mín. 8 caracteres)" />
        <input type="password" id="pw-cf" class="f-input" placeholder="Confirmar nueva" />
        <p id="pw-msg" class="text-[11px] hidden"></p>
        <button type="button" class="btn-p" onclick="changePassword()">Actualizar contraseña</button>
      </div>
    </div>

    <div class="glass rounded-2xl p-5">
      <p class="text-[9px] uppercase tracking-widest text-slate-600 font-bold mb-2">Suscripción</p>
      <p class="text-[11px] text-slate-500 leading-relaxed mb-3">Para cancelar tu plan, gestioná la suscripción desde Gumroad. Tu acceso se desactiva automáticamente al cancelar.</p>
      <a id="cancel-link" href="#" target="_blank" rel="noopener" class="text-[11px] text-violet-400 hover:text-violet-300 no-underline font-medium">Gestionar suscripción en Gumroad →</a>
    </div>

    <a href="/auth/logout" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-[11px] font-semibold text-red-400 glass hover:bg-red-500/10 transition-colors no-underline">
      Cerrar sesión
    </a>
  </div>
</main>

<script>
fetch('/auth/me').then(r=>r.json()).then(u=>{
  const plans={basico:'Plan Básico',pro:'Plan Pro',max:'Plan Max'};
  document.getElementById('cfg-name').textContent=u.name||'—';
  document.getElementById('cfg-email').textContent=u.email||u.sub||'—';
  document.getElementById('cfg-plan').textContent=plans[u.plan]||u.plan||'—';
  document.getElementById('cfg-brand').textContent=u.brand_name||'—';
}).catch(()=>{});

var gumroadUrl = 'https://gumroad.com/library';
document.getElementById('cancel-link').href = gumroadUrl;

async function changePassword(){
  var msg=document.getElementById('pw-msg');
  var r=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    current_password:document.getElementById('pw-cur').value,
    new_password:document.getElementById('pw-new').value
  })});
  msg.classList.remove('hidden');
  if(r.ok){msg.textContent='Contraseña actualizada';msg.style.color='#34D399';}
  else{var d=await r.json().catch(function(){return{};});msg.textContent=d.detail||'Error';msg.style.color='#F87171';}
  if(document.getElementById('pw-new').value!==document.getElementById('pw-cf').value){msg.textContent='Las contraseñas no coinciden';msg.style.color='#F87171';msg.classList.remove('hidden');}
}
</script>
</body>
</html>
