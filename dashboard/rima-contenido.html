<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RIMA — Contenido</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#0A0A0F;color:#F1F5F9}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
    .glass{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);backdrop-filter:blur(12px)}
    .glass-hover:hover{background:rgba(255,255,255,0.07);border-color:rgba(124,58,237,0.3);transition:all .2s}
    .gradient-text{background:linear-gradient(135deg,#7C3AED,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .btn-primary{background:linear-gradient(135deg,#7C3AED,#6D28D9);border:none;cursor:pointer;transition:all .2s}
    .btn-primary:hover{background:linear-gradient(135deg,#8B5CF6,#7C3AED);box-shadow:0 4px 20px rgba(124,58,237,0.4);transform:translateY(-1px)}
    .btn-tg{background:linear-gradient(135deg,#0EA5E9,#06B6D4);border:none;cursor:pointer;transition:all .2s}
    .btn-tg:hover{box-shadow:0 4px 20px rgba(6,182,212,0.4);transform:translateY(-1px)}
    .btn-sm{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
    .tab-btn{transition:all .2s;cursor:pointer;border:1px solid transparent;border-bottom:none}
    .tab-btn.active{background:linear-gradient(135deg,rgba(124,58,237,0.18),rgba(6,182,212,0.08));border-color:rgba(124,58,237,0.4);color:#fff}
    .tab-btn:not(.active):hover{background:rgba(255,255,255,0.04)}
    .tab-panel{display:none}.tab-panel.active{display:block}
    /* Slide thumbnails */
    .slide-v{width:44px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;aspect-ratio:9/16}
    .slide-v:hover{border-color:rgba(244,63,94,0.45);background:rgba(244,63,94,0.07);transform:scale(1.05)}
    .slide-sq{width:56px;aspect-ratio:1;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0}
    .slide-sq:hover{border-color:rgba(6,182,212,0.45);background:rgba(6,182,212,0.07);transform:scale(1.05)}
    .slide-reel{width:72px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;flex-shrink:0;position:relative;cursor:pointer;transition:all .15s}
    .slide-reel:hover{transform:scale(1.03)}
    /* Status colors */
    .badge-pub{background:rgba(52,211,153,0.15);color:#34D399;border:1px solid rgba(52,211,153,0.3)}
    .badge-prog{background:rgba(14,165,233,0.15);color:#38BDF8;border:1px solid rgba(14,165,233,0.3)}
    .badge-val{background:rgba(245,158,11,0.15);color:#FBBF24;border:1px solid rgba(245,158,11,0.3)}
    .badge-pend{background:rgba(100,116,139,0.15);color:#94A3B8;border:1px solid rgba(100,116,139,0.2)}
    /* Modal */
    .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.78);display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px}
    /* Spinner */
    .spinner{border:2px solid rgba(255,255,255,0.1);border-top-color:#7C3AED;border-radius:50%;width:14px;height:14px;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* Select dark */
    select{background:#111827!important;color:#F1F5F9!important;border:1px solid rgba(255,255,255,0.12)!important;border-radius:10px!important;padding:5px 10px!important;font-size:12px!important;font-family:'Inter',sans-serif!important;outline:none!important;cursor:pointer}
    select option{background:#111827!important;color:#F1F5F9!important}
    /* Regen counter */
    .regen-0{background:rgba(124,58,237,0.12);color:#A78BFA;border:1px solid rgba(124,58,237,0.25)}
    .regen-1{background:rgba(245,158,11,0.12);color:#FBBF24;border:1px solid rgba(245,158,11,0.25)}
    .regen-2{background:rgba(239,68,68,0.12);color:#F87171;border:1px solid rgba(239,68,68,0.25)}
    .regen-3{background:rgba(100,116,139,0.12);color:#64748B;border:1px solid rgba(100,116,139,0.2);cursor:not-allowed!important;opacity:.5}
  </style>
</head>
<body class="flex h-screen overflow-hidden">

<aside class="w-64 flex-shrink-0 flex flex-col h-full glass border-r border-white/5"></aside>

<main class="flex-1 flex flex-col h-full overflow-hidden">

  <!-- ── Header ── -->
  <div class="px-5 pt-4 pb-0 border-b border-white/5 flex-shrink-0">
    <div class="flex items-center justify-between mb-3">
      <!-- Título + selector de mes -->
      <div class="flex items-center gap-3">
        <svg class="w-4 h-4 text-pink-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
        </svg>
        <h1 class="text-sm font-bold text-white">Contenido</h1>
        <svg class="w-3 h-3 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
        <select id="month-select" onchange="onMonthChange()"></select>
      </div>
      <!-- Counters -->
      <div class="flex items-center gap-4 text-[11px] pb-1">
        <span class="text-slate-500">Historias: <span id="cnt-h" class="text-rose-400 font-bold">0</span></span>
        <span class="text-slate-500">Carruseles: <span id="cnt-c" class="text-cyan-400 font-bold">0</span></span>
        <span class="text-slate-500">Reels: <span id="cnt-r" class="text-violet-400 font-bold">0</span></span>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex gap-1">
      <button type="button" id="tab-historias" onclick="switchTab('historias')"
        class="tab-btn active rounded-t-xl px-5 py-2.5 text-xs font-semibold flex items-center gap-2">
        <span class="w-3.5 h-3.5 rounded-sm inline-block" style="background:linear-gradient(135deg,#F43F5E,#FB923C)"></span>
        Historias <span id="tb-h" class="text-[9px] px-1.5 py-0.5 rounded-full bg-rose-500/20 text-rose-400">0</span>
      </button>
      <button type="button" id="tab-carruseles" onclick="switchTab('carruseles')"
        class="tab-btn rounded-t-xl px-5 py-2.5 text-xs font-semibold text-slate-400 flex items-center gap-2">
        <span class="w-3.5 h-3.5 rounded-sm inline-block" style="background:linear-gradient(135deg,#06B6D4,#3B82F6)"></span>
        Carruseles <span id="tb-c" class="text-[9px] px-1.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-400">0</span>
      </button>
      <button type="button" id="tab-reels" onclick="switchTab('reels')"
        class="tab-btn rounded-t-xl px-5 py-2.5 text-xs font-semibold text-slate-400 flex items-center gap-2">
        <span class="w-3.5 h-3.5 rounded-sm inline-block" style="background:linear-gradient(135deg,#7C3AED,#A855F7)"></span>
        Reels <span id="tb-r" class="text-[9px] px-1.5 py-0.5 rounded-full bg-violet-500/20 text-violet-400">0</span>
      </button>
    </div>
  </div>

  <!-- ── Content panels ── -->
  <div class="flex-1 overflow-y-auto px-5 py-4">
    <div id="panel-historias" class="tab-panel active space-y-3"></div>
    <div id="panel-carruseles" class="tab-panel space-y-3"></div>
    <div id="panel-reels" class="tab-panel space-y-3"></div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
      <svg class="w-10 h-10 text-slate-700 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
      </svg>
      <p class="text-[13px] font-semibold text-slate-500">Sin contenido para este mes</p>
      <p class="text-[11px] text-slate-600 mt-1">Genera el plan mensual desde el <a href="/calendario" class="text-violet-400 hover:underline">Calendario</a></p>
    </div>
  </div>
</main>

<!-- ══════════ Modal: Copy completo ══════════ -->
<div id="modal-copy" class="modal-ov hidden" onclick="if(event.target===this)closeCopyModal()">
  <div class="glass rounded-2xl w-full max-w-lg max-h-[85vh] flex flex-col" style="border:1px solid rgba(255,255,255,0.1)">
    <!-- Modal header -->
    <div class="flex items-start justify-between p-5 border-b border-white/5 flex-shrink-0">
      <div>
        <div id="copy-modal-badges" class="flex gap-2 flex-wrap mb-2"></div>
        <h2 id="copy-modal-title" class="text-sm font-bold text-white leading-snug"></h2>
      </div>
      <button type="button" onclick="closeCopyModal()" style="background:none;border:none;color:#64748B;cursor:pointer;font-size:18px;line-height:1;flex-shrink:0;padding:2px 6px">✕</button>
    </div>
    <!-- Modal body scrollable -->
    <div id="copy-modal-body" class="flex-1 overflow-y-auto p-5 space-y-3"></div>
  </div>
</div>

<script>
(function(){
'use strict';

var today = new Date();
var curYear = today.getFullYear();
var curMonth = today.getMonth(); // 0-indexed
var items = [];
var curTab = 'historias';

var MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ── Type config ──
var TC = {
  historia: {color:'rose',  bg:'rgba(244,63,94,0.15)',  border:'rgba(244,63,94,0.4)',  text:'#FB7185', label:'Historia', imgCat:'historias'},
  carrusel: {color:'cyan',  bg:'rgba(6,182,212,0.15)',  border:'rgba(6,182,212,0.4)',  text:'#22D3EE', label:'Carrusel', imgCat:'carruseles'},
  reel:     {color:'violet',bg:'rgba(124,58,237,0.15)', border:'rgba(124,58,237,0.4)', text:'#A78BFA', label:'Reel',     imgCat:'clips'},
};
var SC = {
  publicado:  {cls:'badge-pub',  label:'Publicado'},
  programado: {cls:'badge-prog', label:'Programado'},
  validacion: {cls:'badge-val',  label:'En validación'},
  pendiente:  {cls:'badge-pend', label:'Pendiente'},
};

// ── Month selector init ──
function initMonthSelect() {
  var sel = document.getElementById('month-select');
  var now = new Date();
  var html = '';
  // 3 meses atrás, mes actual, 3 meses adelante
  for (var i = -3; i <= 3; i++) {
    var d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    var val = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    var label = MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    var selected = (d.getFullYear() === curYear && d.getMonth() === curMonth) ? 'selected' : '';
    html += '<option value="'+val+'" '+selected+'>'+label+'</option>';
  }
  sel.innerHTML = html;
}

function onMonthChange() {
  var val = document.getElementById('month-select').value;
  var parts = val.split('-');
  curYear = parseInt(parts[0]);
  curMonth = parseInt(parts[1]) - 1;
  loadItems();
}
window.onMonthChange = onMonthChange;

// ── API ──
async function api(method, url, body) {
  var opts = {method: method, headers:{'Content-Type':'application/json'}};
  if (body) opts.body = JSON.stringify(body);
  var r = await fetch(url, opts);
  if (!r.ok) { var e = await r.json(); throw new Error(e.detail || 'Error '+r.status); }
  return await r.json();
}

async function loadItems() {
  try {
    var ms = curYear+'-'+String(curMonth+1).padStart(2,'0');
    var d = await api('GET','/api/calendar?month='+ms);
    items = d.items || [];
  } catch(e) { items = []; }
  renderAll();
}

// ── Render ──
function renderAll() {
  var hist = items.filter(function(i){return i.type==='historia';});
  var carr = items.filter(function(i){return i.type==='carrusel';});
  var reel = items.filter(function(i){return i.type==='reel';});

  // Update counters
  document.getElementById('cnt-h').textContent = hist.length;
  document.getElementById('cnt-c').textContent = carr.length;
  document.getElementById('cnt-r').textContent = reel.length;
  document.getElementById('tb-h').textContent = hist.length;
  document.getElementById('tb-c').textContent = carr.length;
  document.getElementById('tb-r').textContent = reel.length;

  // Render panels
  renderPanel('panel-historias', hist, 'historia');
  renderPanel('panel-carruseles', carr, 'carrusel');
  renderPanel('panel-reels', reel, 'reel');

  // Empty state
  var empty = document.getElementById('empty-state');
  if (items.length === 0) {
    empty.classList.remove('hidden');
    empty.style.display = 'flex';
  } else {
    empty.classList.add('hidden');
    empty.style.display = 'none';
  }
}

function renderPanel(panelId, typeItems, type) {
  var panel = document.getElementById(panelId);
  panel.innerHTML = '';
  if (typeItems.length === 0) {
    panel.innerHTML = '<div style="text-align:center;padding:40px 0;color:#334155;font-size:12px">Sin '+type+'s este mes</div>';
    return;
  }
  typeItems.forEach(function(item){
    panel.appendChild(buildCard(item, type));
  });
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function dateLabel(d){
  if(!d) return '';
  var p=d.split('-'); if(p.length<3) return d;
  return parseInt(p[2])+' '+MONTHS[parseInt(p[1])-1].slice(0,3);
}

// ── Build card ──
function buildCard(item, type) {
  var tc = TC[type] || TC.reel;
  var sc = SC[item.status] || SC.pendiente;
  var regen = item.regen_count || 0;
  var slides = item.slides || [];
  var hasTg = item.telegram_sent;
  var approved = item.telegram_approved;

  var card = document.createElement('div');
  card.className = 'glass rounded-2xl overflow-hidden';
  card.style.border = '1px solid rgba(255,255,255,0.06)';
  if (item.status === 'validacion') card.style.borderColor = 'rgba(245,158,11,0.25)';
  if (item.status === 'publicado')  card.style.borderColor = 'rgba(52,211,153,0.2)';

  // ── Card header ──
  var hdr = document.createElement('div');
  hdr.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:10px 16px 10px;background:'+tc.bg.replace('0.15','0.05')+';border-bottom:1px solid rgba(255,255,255,0.05)';

  // Left: date + badges
  var hLeft = document.createElement('div');
  hLeft.style.cssText = 'display:flex;align-items:center;gap:6px;flex-wrap:wrap';
  hLeft.innerHTML =
    '<span style="font-size:10px;padding:2px 7px;border-radius:6px;background:rgba(100,116,139,0.15);color:#64748B;font-weight:600">'+dateLabel(item.date)+'</span>'
    +'<span style="font-size:10px;padding:2px 8px;border-radius:6px;background:'+tc.bg+';color:'+tc.text+';border:1px solid '+tc.border+'">'+tc.label+'</span>'
    +'<span class="'+sc.cls+'" style="font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600">'+sc.label+'</span>';
  hdr.appendChild(hLeft);

  // Right: Regenerar button
  var regenClass = 'regen-'+Math.min(regen,3);
  var regenDisabled = regen >= 3;
  var regenBtn = document.createElement('button');
  regenBtn.type = 'button';
  regenBtn.className = regenClass + ' btn-sm';
  regenBtn.style.cssText = 'display:flex;align-items:center;gap:5px;';
  regenBtn.innerHTML = '<svg style="width:11px;height:11px" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>Regenerar ('+regen+'/3)';
  regenBtn.disabled = regenDisabled;
  if (!regenDisabled) {
    (function(id){ regenBtn.addEventListener('click', function(){ doRegen(id); }); })(item.id);
  }
  hdr.appendChild(regenBtn);
  card.appendChild(hdr);

  // ── Card body ──
  var body = document.createElement('div');
  body.style.cssText = 'display:flex;gap:14px;padding:14px 16px';

  // Slides column
  var slidesCol = document.createElement('div');
  slidesCol.style.cssText = 'display:flex;gap:4px;flex-shrink:0;align-items:flex-start;padding-top:2px';
  var numSlides = type === 'reel' ? 1 : (type === 'carrusel' ? Math.max(5, slides.length || 6) : Math.max(5, slides.length || 5));
  if (type === 'reel') numSlides = 1;

  for (var si = 0; si < Math.min(numSlides, 7); si++) {
    var slide = slides[si] || null;
    var slEl = document.createElement('div');
    var slClass = type === 'carrusel' ? 'slide-sq' : 'slide-v';
    slEl.className = slClass;
    if (si === 0) {
      slEl.style.background = tc.bg;
      slEl.style.borderColor = tc.border;
    }
    var label = slide ? slide.label : (si === 0 ? 'Hook' : String(si+1));
    slEl.innerHTML = '<span style="font-size:9px;font-weight:700;color:'+(si===0?tc.text:'#475569')+'">'+esc(si+1)+'</span>'
      +'<span style="font-size:7px;color:#334155;margin-top:2px;text-align:center;line-height:1.2;max-width:38px;overflow:hidden">'+esc(label.slice(0,8))+'</span>';
    slEl.title = slide ? slide.copy : 'Click para ver copy';
    (function(it, slideIdx){ slEl.addEventListener('click', function(){ openCopyModal(it, slideIdx); }); })(item, si);
    slidesCol.appendChild(slEl);
  }
  // +N indicator
  if (slides.length > 7) {
    var more = document.createElement('div');
    more.style.cssText = 'font-size:10px;color:#334155;display:flex;align-items:center;padding-top:20px';
    more.textContent = '+' + (slides.length - 7);
    slidesCol.appendChild(more);
  }
  body.appendChild(slidesCol);

  // Content column
  var contentCol = document.createElement('div');
  contentCol.style.cssText = 'flex:1;min-width:0';

  // Title + actions
  var titleRow = document.createElement('div');
  titleRow.style.cssText = 'display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px';

  var titleBlock = document.createElement('div');
  titleBlock.style.cssText = 'flex:1;min-width:0';
  titleBlock.innerHTML = '<p style="font-size:13px;font-weight:700;color:#fff;line-height:1.4;margin:0">'+esc(item.title)+'</p>';
  if (item.status === 'publicado' && item.metrics && item.metrics.views) {
    titleBlock.innerHTML += '<div style="display:flex;gap:12px;margin-top:5px;font-size:10px;color:#64748B">'
      + '<span>👁 <strong style="color:#fff">'+fmtNum(item.metrics.views)+'</strong></span>'
      + (item.metrics.comments ? '<span>💬 <strong style="color:#fff">'+fmtNum(item.metrics.comments)+'</strong></span>' : '')
      + '</div>';
  }
  titleRow.appendChild(titleBlock);

  // Action buttons
  var actBtns = document.createElement('div');
  actBtns.style.cssText = 'display:flex;gap:5px;flex-shrink:0';
  // Ver copy button
  var copyBtn = document.createElement('button');
  copyBtn.type = 'button'; copyBtn.className = 'btn-sm glass-hover';
  copyBtn.style.cssText = 'background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);color:#94A3B8';
  copyBtn.textContent = 'Ver copy';
  (function(it){ copyBtn.addEventListener('click', function(){ openCopyModal(it, 0); }); })(item);
  actBtns.appendChild(copyBtn);

  // Telegram / approve button
  var tgBtn = document.createElement('button');
  tgBtn.type = 'button';
  if (approved) {
    tgBtn.className = 'btn-sm badge-pub'; tgBtn.style.cssText='border-radius:8px;';
    tgBtn.textContent = '✓ Aprobado';
    tgBtn.disabled = true;
  } else if (hasTg) {
    tgBtn.className = 'btn-sm'; tgBtn.style.cssText='background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.25);color:#FBBF24;border-radius:8px;';
    tgBtn.textContent = 'Marcar aprobado';
    (function(id){ tgBtn.addEventListener('click', function(){ doApprove(id); }); })(item.id);
  } else if (item.status !== 'publicado') {
    tgBtn.className = 'btn-sm btn-tg'; tgBtn.style.cssText='color:#fff;border-radius:8px;';
    tgBtn.innerHTML = '<svg style="width:11px;height:11px;display:inline;vertical-align:middle;margin-right:3px" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8l-1.7 8.02c-.13.58-.47.72-.95.45l-2.6-1.92-1.26 1.21c-.14.14-.26.26-.52.26l.19-2.65 4.81-4.35c.21-.19-.04-.29-.32-.1L8.41 14.8l-2.55-.8c-.55-.17-.56-.55.12-.82l9.97-3.84c.46-.17.86.11.69.66z"/></svg>Validar';
    (function(id){ tgBtn.addEventListener('click', function(){ doTelegram(id); }); })(item.id);
  }
  if (tgBtn.textContent || tgBtn.innerHTML) actBtns.appendChild(tgBtn);
  titleRow.appendChild(actBtns);
  contentCol.appendChild(titleRow);

  // Caption / descripción
  if (item.caption) {
    var capBox = document.createElement('div');
    capBox.style.cssText = 'padding:10px 12px;border-radius:10px;margin-bottom:8px;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.06)';
    capBox.innerHTML = '<p style="font-size:9px;color:#475569;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Descripción general</p>'
      + '<p style="font-size:11px;color:#CBD5E1;line-height:1.65">'+esc(item.caption)+'</p>';
    if (item.hashtags && item.hashtags.length) {
      capBox.innerHTML += '<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">'
        + item.hashtags.map(function(h){ return '<span style="font-size:9px;color:'+tc.text+';opacity:.7">'+esc(h)+'</span>'; }).join('')
        + '</div>';
    }
    contentCol.appendChild(capBox);
  }

  // Per-slide preview (if slides exist)
  if (slides.length > 0) {
    var slidePreview = document.createElement('div');
    slidePreview.style.cssText = 'padding:8px 12px;border-radius:10px;margin-bottom:8px;background:rgba(255,255,255,0.015);border:1px solid rgba(255,255,255,0.05);cursor:pointer';
    slidePreview.innerHTML = '<p style="font-size:9px;color:#475569;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Copy por slide — click para expandir</p>';
    var previewList = document.createElement('div');
    previewList.style.cssText = 'display:flex;flex-direction:column;gap:4px';
    slides.slice(0,3).forEach(function(sl){
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:6px;align-items:flex-start';
      row.innerHTML = '<span style="font-size:9px;background:'+tc.bg+';color:'+tc.text+';border-radius:4px;padding:1px 5px;flex-shrink:0;font-weight:700">'+esc(sl.label)+'</span>'
        +'<span style="font-size:10px;color:#94A3B8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+esc((sl.copy||'').slice(0,70))+(sl.copy && sl.copy.length>70?'…':'')+'</span>';
      previewList.appendChild(row);
    });
    if (slides.length > 3) {
      var moreRow = document.createElement('p');
      moreRow.style.cssText = 'font-size:9px;color:#334155;margin-top:2px';
      moreRow.textContent = '+ '+(slides.length-3)+' slides más → Ver copy completo';
      previewList.appendChild(moreRow);
    }
    slidePreview.appendChild(previewList);
    (function(it){ slidePreview.addEventListener('click', function(){ openCopyModal(it, 0); }); })(item);
    contentCol.appendChild(slidePreview);
  }

  // Files + actions row
  var filesRow = document.createElement('div');
  filesRow.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap';

  // Files label
  var filesLabel = document.createElement('span');
  filesLabel.style.cssText = 'font-size:9px;color:#334155;font-weight:600;flex-shrink:0';
  filesLabel.textContent = 'Archivos:';
  filesRow.appendChild(filesLabel);

  // Copy file (always)
  var copyFile = makeFileChip('copy_slides.txt', 'file', tc.text, item, 0);
  filesRow.appendChild(copyFile);

  // Image/video select button
  var imgBtn = document.createElement('a');
  imgBtn.href = type === 'reel' ? '/videos' : '/imagenes?cat=' + tc.imgCat;
  imgBtn.style.cssText = 'display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;text-decoration:none;cursor:pointer;background:'+tc.bg+';border:1px solid '+tc.border+';color:'+tc.text;
  imgBtn.innerHTML = (type === 'reel'
    ? '<svg style="width:10px;height:10px" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5l4.72-4.72a.75.75 0 011.28.53v11.38a.75.75 0 01-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25h-9A2.25 2.25 0 002.25 7.5v9a2.25 2.25 0 002.25 2.25z"/></svg>Seleccionar video'
    : '<svg style="width:10px;height:10px" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/></svg>Seleccionar imágenes');
  filesRow.appendChild(imgBtn);

  // Generate slides button (if no slides)
  if (slides.length === 0) {
    var genSlBtn = document.createElement('button');
    genSlBtn.type = 'button';
    genSlBtn.style.cssText = 'display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.25);color:#A78BFA;font-family:Inter,sans-serif';
    genSlBtn.innerHTML = '<svg style="width:10px;height:10px" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/></svg>Generar copy';
    (function(id, btn){ genSlBtn.addEventListener('click', function(){ doGenerateSlides(id, btn); }); })(item.id, genSlBtn);
    filesRow.appendChild(genSlBtn);
  }

  // Telegram waiting state
  if (hasTg && !approved) {
    var tgWait = document.createElement('span');
    tgWait.style.cssText = 'font-size:9px;color:#FBBF24;display:flex;align-items:center;gap:4px';
    tgWait.innerHTML = '<div class="spinner" style="border-top-color:#FBBF24;width:10px;height:10px"></div>Esperando respuesta del cliente...';
    filesRow.appendChild(tgWait);
  }

  contentCol.appendChild(filesRow);
  body.appendChild(contentCol);
  card.appendChild(body);
  return card;
}

function fmtNum(n){ return n>=1000?(n/1000).toFixed(1)+'K':String(n); }

function makeFileChip(name, fileType, color, item, slideIdx) {
  var chip = document.createElement('div');
  chip.style.cssText = 'display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);cursor:pointer;transition:background .15s';
  chip.onmouseover = function(){ this.style.background='rgba(255,255,255,0.07)'; };
  chip.onmouseout  = function(){ this.style.background='rgba(255,255,255,0.03)'; };
  chip.innerHTML = '<svg style="width:10px;height:10px;color:'+color+'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>'
    +'<span style="font-size:10px;color:#94A3B8">'+esc(name)+'</span>';
  (function(it, idx){ chip.addEventListener('click', function(){ openCopyModal(it, idx); }); })(item, slideIdx);
  return chip;
}

// ── Actions ──
async function doRegen(itemId) {
  var item = items.find(function(i){ return i.id===itemId; });
  if (!item || (item.regen_count||0)>=3) return;
  if (!confirm('¿Regenerar esta propuesta con un ángulo diferente?')) return;
  try {
    var updated = await api('POST', '/api/calendar/'+itemId+'/regenerate');
    var idx = items.findIndex(function(i){ return i.id===itemId; });
    if (idx>=0) items[idx] = updated;
    renderAll();
    window.rimaToast && rimaToast('Propuesta regenerada ('+(updated.regen_count)+'/3)');
  } catch(e) { window.rimaToast && rimaToast(e.message, 'error'); }
}
window.doRegen = doRegen;

async function doGenerateSlides(itemId, btn) {
  var orig = btn.innerHTML;
  btn.innerHTML = '<div class="spinner"></div> Generando...';
  btn.disabled = true;
  try {
    var result = await api('POST', '/api/calendar/'+itemId+'/generate-slides');
    var idx = items.findIndex(function(i){ return i.id===itemId; });
    if (idx>=0) items[idx].slides = result.slides;
    renderAll();
    window.rimaToast && rimaToast('Copy por slide generado — '+result.slides.length+' slides');
  } catch(e) {
    btn.innerHTML = orig; btn.disabled = false;
    window.rimaToast && rimaToast(e.message, 'error');
  }
}
window.doGenerateSlides = doGenerateSlides;

async function doTelegram(itemId) {
  try {
    var updated = await api('POST', '/api/calendar/'+itemId+'/telegram');
    var idx = items.findIndex(function(i){ return i.id===itemId; });
    if (idx>=0) items[idx] = updated.item;
    renderAll();
    window.rimaToast && rimaToast('Enviado a validación — esperando respuesta del cliente');
  } catch(e) { window.rimaToast && rimaToast(e.message, 'error'); }
}
window.doTelegram = doTelegram;

async function doApprove(itemId) {
  try {
    var updated = await api('POST', '/api/calendar/'+itemId+'/approve');
    var idx = items.findIndex(function(i){ return i.id===itemId; });
    if (idx>=0) items[idx] = updated.item;
    renderAll();
    window.rimaToast && rimaToast('Aprobado — movido a Programado');
  } catch(e) { window.rimaToast && rimaToast(e.message, 'error'); }
}
window.doApprove = doApprove;

// ── Copy Modal ──
function openCopyModal(item, startSlide) {
  var tc = TC[item.type] || TC.reel;
  var sc = SC[item.status] || SC.pendiente;
  var slides = item.slides || [];

  document.getElementById('copy-modal-badges').innerHTML =
    '<span style="font-size:9px;padding:2px 8px;border-radius:6px;background:'+tc.bg+';color:'+tc.text+';border:1px solid '+tc.border+'">'+tc.label+'</span>'
    +'<span class="'+sc.cls+'" style="font-size:9px;padding:2px 8px;border-radius:6px;font-weight:600">'+sc.label+'</span>'
    +'<span style="font-size:9px;color:#334155">'+item.date+'</span>';
  document.getElementById('copy-modal-title').textContent = item.title;

  var body = document.getElementById('copy-modal-body');
  body.innerHTML = '';

  // Overall caption
  if (item.caption) {
    var capSec = document.createElement('div');
    capSec.style.cssText = 'padding:12px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07)';
    capSec.innerHTML = '<p style="font-size:9px;color:#475569;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Descripción / Caption general</p>'
      +'<p style="font-size:12px;color:#CBD5E1;line-height:1.7">'+esc(item.caption)+'</p>';
    if (item.hashtags && item.hashtags.length) {
      capSec.innerHTML += '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">'
        + item.hashtags.map(function(h){ return '<span style="font-size:10px;color:'+tc.text+';opacity:.75">'+esc(h)+'</span>'; }).join('')+'</div>';
    }
    body.appendChild(capSec);
  }

  // Per-slide copies
  if (slides.length > 0) {
    var divider = document.createElement('p');
    divider.style.cssText = 'font-size:9px;color:#334155;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:0';
    divider.textContent = 'Copy por slide';
    body.appendChild(divider);

    slides.forEach(function(sl, i) {
      var slCard = document.createElement('div');
      var isStart = i === startSlide;
      slCard.style.cssText = 'padding:10px 12px;border-radius:10px;background:'
        +(isStart ? tc.bg : 'rgba(255,255,255,0.02)')+';border:1px solid '
        +(isStart ? tc.border : 'rgba(255,255,255,0.06)');
      slCard.innerHTML =
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">'
        +'<span style="font-size:11px;font-weight:700;color:'+tc.text+';background:'+tc.bg+';border:1px solid '+tc.border+';padding:2px 7px;border-radius:5px">Slide '+sl.num+'</span>'
        +'<span style="font-size:11px;color:#64748B;font-weight:600">'+esc(sl.label)+'</span>'
        +'</div>'
        +'<p style="font-size:12px;color:#F1F5F9;line-height:1.65">'+esc(sl.copy)+'</p>';
      body.appendChild(slCard);
    });
  } else {
    var noSlides = document.createElement('div');
    noSlides.style.cssText = 'text-align:center;padding:24px;color:#334155;font-size:11px';
    noSlides.innerHTML = '<p>No hay copy por slide generado aún.</p><p style="margin-top:4px">Usa el botón <strong style="color:#A78BFA">Generar copy</strong> en la tarjeta.</p>';
    body.appendChild(noSlides);
  }

  document.getElementById('modal-copy').classList.remove('hidden');
}
function closeCopyModal() { document.getElementById('modal-copy').classList.add('hidden'); }
window.closeCopyModal = closeCopyModal;

// ── Tabs ──
function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('panel-'+tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); b.style.color=''; });
  var btn = document.getElementById('tab-'+tab);
  btn.classList.add('active');
}
window.switchTab = switchTab;

// ── ESC to close ──
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeCopyModal(); });

// ── Init ──
initMonthSelect();
loadItems();

})();
</script>
