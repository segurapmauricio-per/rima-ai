<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIMA AI — Acceso</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0A0F1E;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  /* Fondo animado */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 20%, rgba(124,58,237,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(6,182,212,0.12) 0%, transparent 55%);
    pointer-events: none;
  }

  .card {
    position: relative;
    width: 420px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(124,58,237,0.25);
    border-radius: 20px;
    padding: 44px 40px 40px;
    backdrop-filter: blur(24px);
    box-shadow: 0 0 60px rgba(124,58,237,0.12), 0 24px 48px rgba(0,0,0,0.4);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #7C3AED, #06B6D4);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: white;
    letter-spacing: -1px;
  }

  .logo-text {
    font-size: 22px;
    font-weight: 700;
    color: #F1F5F9;
    letter-spacing: -0.5px;
  }

  .logo-text span {
    background: linear-gradient(135deg, #A78BFA, #06B6D4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    color: #F1F5F9;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 13px;
    color: #64748B;
    margin-bottom: 32px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #94A3B8;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid rgba(100,116,139,0.3);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    color: #F1F5F9;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    margin-bottom: 20px;
  }

  input:focus {
    border-color: rgba(124,58,237,0.6);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.12);
  }

  input::placeholder { color: #475569; }

  button {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #7C3AED, #5B21B6);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 4px;
    letter-spacing: -0.2px;
  }

  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.99); }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .error {
    display: none;
    background: rgba(244,63,94,0.1);
    border: 1px solid rgba(244,63,94,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: #FDA4AF;
    margin-bottom: 20px;
    text-align: center;
  }

  .error.show { display: block; }

  .footer {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: #334155;
  }

  .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">R</div>
    <div class="logo-text">RIMA <span>AI</span></div>
  </div>

  <h1>Bienvenido</h1>
  <p class="subtitle">Ingresa tus credenciales para acceder al panel</p>

  <div class="error" id="error-msg">Credenciales incorrectas. Intenta de nuevo.</div>

  <form id="login-form" onsubmit="handleLogin(event)">
    <label for="email">Correo electronico</label>
    <input type="email" id="email" name="email" placeholder="tu@email.com" required autocomplete="email">

    <label for="password">Contrasena</label>
    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">

    <button type="submit" id="btn">
      <span id="btn-text">Ingresar</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </form>

  <div class="footer">RIMA AI &copy; 2024 &mdash; Marketing Intelligence</div>
</div>

<script>
async function handleLogin(e) {
  e.preventDefault();
  const btn      = document.getElementById('btn');
  const btnText  = document.getElementById('btn-text');
  const spinner  = document.getElementById('spinner');
  const errorMsg = document.getElementById('error-msg');

  btn.disabled    = true;
  btnText.style.display = 'none';
  spinner.style.display = 'block';
  errorMsg.classList.remove('show');

  const email    = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
      credentials: 'include',
    });

    if (res.ok) {
      const data = await res.json();
      window.location.href = data.redirect || '/';
    } else {
      errorMsg.classList.add('show');
    }
  } catch {
    errorMsg.textContent = 'Error de conexion. Intenta de nuevo.';
    errorMsg.classList.add('show');
  } finally {
    btn.disabled = false;
    btnText.style.display = 'block';
    spinner.style.display = 'none';
  }
}
</script>
</body>
</html>
