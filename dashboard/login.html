<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIMA AI — Acceso</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0A0F1E;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  /* Fondo animado */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 20%, rgba(124,58,237,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(6,182,212,0.12) 0%, transparent 55%);
    pointer-events: none;
  }

  .card {
    position: relative;
    width: 420px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(124,58,237,0.25);
    border-radius: 20px;
    padding: 44px 40px 40px;
    backdrop-filter: blur(24px);
    box-shadow: 0 0 60px rgba(124,58,237,0.12), 0 24px 48px rgba(0,0,0,0.4);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #7C3AED, #06B6D4);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: white;
    letter-spacing: -1px;
  }

  .logo-text {
    font-size: 22px;
    font-weight: 700;
    color: #F1F5F9;
    letter-spacing: -0.5px;
  }

  .logo-text span {
    background: linear-gradient(135deg, #A78BFA, #06B6D4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    color: #F1F5F9;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 13px;
    color: #64748B;
    margin-bottom: 32px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #94A3B8;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid rgba(100,116,139,0.3);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    color: #F1F5F9;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    margin-bottom: 20px;
  }

  input:focus {
    border-color: rgba(124,58,237,0.6);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.12);
  }

  input::placeholder { color: #475569; }

  button {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #7C3AED, #5B21B6);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 4px;
    letter-spacing: -0.2px;
  }

  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.99); }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .error {
    display: none;
    background: rgba(244,63,94,0.1);
    border: 1px solid rgba(244,63,94,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: #FDA4AF;
    margin-bottom: 20px;
    text-align: center;
  }

  .error.show { display: block; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: #334155;
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(100,116,139,0.2);
  }

  .btn-google {
    width: 100%;
    padding: 12px;
    background: rgba(30,41,59,0.8);
    border: 1px solid rgba(100,116,139,0.3);
    border-radius: 10px;
    color: #CBD5E1;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s;
    margin-top: 0;
    letter-spacing: 0;
  }
  .btn-google:hover {
    background: rgba(30,41,59,1);
    border-color: rgba(100,116,139,0.5);
    opacity: 1;
  }

  .footer {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: #334155;
  }

  .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">R</div>
    <div class="logo-text">RIMA <span>AI</span></div>
  </div>

  <h1>Bienvenido</h1>
  <p class="subtitle">Ingresa tus credenciales para acceder al panel</p>

  <div class="error" id="error-msg">Credenciales incorrectas. Intenta de nuevo.</div>

  <form id="login-form" onsubmit="handleLogin(event)">
    <label for="email">Correo electronico</label>
    <input type="email" id="email" name="email" placeholder="tu@email.com" required autocomplete="email">

    <label for="password">Contrasena</label>
    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">

    <button type="submit" id="btn">
      <span id="btn-text">Ingresar</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </form>

  <div class="divider">o</div>

  <a href="/auth/google" class="btn-google">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908C16.658 14.121 17.64 11.82 17.64 9.2z" fill="#4285F4"/>
      <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
      <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
      <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
    </svg>
    Continuar con Google
  </a>

  <div class="footer">RIMA AI &copy; 2024 &mdash; Marketing Intelligence</div>
</div>

<script>
async function handleLogin(e) {
  e.preventDefault();
  const btn      = document.getElementById('btn');
  const btnText  = document.getElementById('btn-text');
  const spinner  = document.getElementById('spinner');
  const errorMsg = document.getElementById('error-msg');

  btn.disabled    = true;
  btnText.style.display = 'none';
  spinner.style.display = 'block';
  errorMsg.classList.remove('show');

  const email    = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
      credentials: 'include',
    });

    if (res.ok) {
      const data = await res.json();
      window.location.href = data.redirect || '/';
    } else {
      errorMsg.classList.add('show');
    }
  } catch {
    errorMsg.textContent = 'Error de conexion. Intenta de nuevo.';
    errorMsg.classList.add('show');
  } finally {
    btn.disabled = false;
    btnText.style.display = 'block';
    spinner.style.display = 'none';
  }
}
</script>
</body>
</html>
