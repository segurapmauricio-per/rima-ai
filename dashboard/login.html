<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIMA AI — Acceso</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rima-bg: #0A0F1E;
    --rima-card-bg: rgba(15, 23, 42, 0.85);
    --rima-card-border: rgba(124,58,237,0.25);
    --rima-text: #F1F5F9;
    --rima-text-muted: #94A3B8;
    --rima-text-faint: #64748B;
    --rima-text-faintest: #475569;
    --rima-text-ghost: #334155;
    --rima-input-bg: rgba(30, 41, 59, 0.8);
    --rima-input-border: rgba(100,116,139,0.3);
    --rima-danger-bg: rgba(244,63,94,0.1);
    --rima-danger-border: rgba(244,63,94,0.3);
    --rima-danger-text: #FDA4AF;
    --rima-google-bg: rgba(30,41,59,0.8);
    --rima-google-bg-hover: rgba(30,41,59,1);
    --rima-google-border: rgba(100,116,139,0.3);
    --rima-google-border-hover: rgba(100,116,139,0.5);
    --rima-google-text: #CBD5E1;
    --rima-glow-1: rgba(124,58,237,0.18);
    --rima-glow-2: rgba(6,182,212,0.12);
    --rima-toggle-bg: rgba(255,255,255,0.06);
    --rima-toggle-border: rgba(255,255,255,0.12);
  }
  :root[data-theme="light"] {
    --rima-bg: #F7F8FB;
    --rima-card-bg: rgba(255,255,255,0.92);
    --rima-card-border: #DDE2EC;
    --rima-text: #1B2130;
    --rima-text-muted: #5B6478;
    --rima-text-faint: #7A8296;
    --rima-text-faintest: #98A0B3;
    --rima-text-ghost: #B7BECC;
    --rima-input-bg: rgba(27,33,48,0.04);
    --rima-input-border: rgba(27,33,48,0.14);
    --rima-danger-bg: rgba(225,29,72,0.08);
    --rima-danger-border: rgba(225,29,72,0.25);
    --rima-danger-text: #E11D48;
    --rima-google-bg: #FFFFFF;
    --rima-google-bg-hover: #FFFFFF;
    --rima-google-border: #DDE2EC;
    --rima-google-border-hover: #C9D0DC;
    --rima-google-text: #1B2130;
    --rima-glow-1: rgba(109,40,217,0.10);
    --rima-glow-2: rgba(2,132,199,0.08);
    --rima-toggle-bg: rgba(27,33,48,0.05);
    --rima-toggle-border: rgba(27,33,48,0.12);
  }

  body {
    min-height: 100vh;
    background: var(--rima-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  /* Fondo animado */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 20%, var(--rima-glow-1) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 80%, var(--rima-glow-2) 0%, transparent 55%);
    pointer-events: none;
  }

  #rima-theme-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--rima-toggle-bg);
    border: 1px solid var(--rima-toggle-border);
    color: var(--rima-text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .15s;
  }
  #rima-theme-toggle:hover { background: var(--rima-input-bg); }
  #rima-theme-toggle svg { width: 15px; height: 15px; }
  #rima-theme-toggle .icon-sun { display: none; }

  .card {
    position: relative;
    width: 420px;
    background: var(--rima-card-bg);
    border: 1px solid var(--rima-card-border);
    border-radius: 20px;
    padding: 44px 40px 40px;
    backdrop-filter: blur(24px);
    box-shadow: 0 0 60px rgba(124,58,237,0.12), 0 24px 48px rgba(0,0,0,0.4);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #7C3AED, #06B6D4);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: white;
    letter-spacing: -1px;
  }

  .logo-text {
    font-size: 22px;
    font-weight: 700;
    color: var(--rima-text);
    letter-spacing: -0.5px;
  }

  .logo-text span {
    background: linear-gradient(135deg, #A78BFA, #06B6D4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    color: var(--rima-text);
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--rima-text-faint);
    margin-bottom: 32px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--rima-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: var(--rima-input-bg);
    border: 1px solid var(--rima-input-border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    color: var(--rima-text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    margin-bottom: 20px;
  }

  input:focus {
    border-color: rgba(124,58,237,0.6);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.12);
  }

  input::placeholder { color: var(--rima-text-faintest); }

  .password-field {
    position: relative;
  }

  .password-field input {
    padding-right: 44px;
  }

  .toggle-password {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: 40px;
    background: none;
    border: none;
    color: var(--rima-text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .toggle-password:hover { color: var(--rima-text); }

  button {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #7C3AED, #5B21B6);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 4px;
    letter-spacing: -0.2px;
  }

  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.99); }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .error {
    display: none;
    background: var(--rima-danger-bg);
    border: 1px solid var(--rima-danger-border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--rima-danger-text);
    margin-bottom: 20px;
    text-align: center;
  }

  .error.show { display: block; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--rima-text-ghost);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--rima-input-border);
  }

  .btn-google {
    width: 100%;
    padding: 12px;
    background: var(--rima-google-bg);
    border: 1px solid var(--rima-google-border);
    border-radius: 10px;
    color: var(--rima-google-text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s;
    margin-top: 0;
    letter-spacing: 0;
  }
  .btn-google:hover {
    background: var(--rima-google-bg-hover);
    border-color: var(--rima-google-border-hover);
    opacity: 1;
  }

  .footer {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: var(--rima-text-ghost);
  }

  .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<script>(function(){try{var t=localStorage.getItem('rima-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<div class="card">
  <button type="button" id="rima-theme-toggle" title="Cambiar tema">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>
  </button>
  <div class="logo">
    <div class="logo-icon">R</div>
    <div class="logo-text">RIMA <span>AI</span></div>
  </div>

  <h1>Bienvenido</h1>
  <p class="subtitle">Ingresa tus credenciales para acceder al panel</p>

  <div class="error" id="error-msg">Credenciales incorrectas. Intenta de nuevo.</div>

  <form id="login-form" onsubmit="handleLogin(event)">
    <label for="email">Correo electronico</label>
    <input type="email" id="email" name="email" placeholder="tu@email.com" required autocomplete="email">

    <label for="password">Contrasena</label>
    <div class="password-field">
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar contraseña" title="Mostrar contraseña">
        <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>

    <button type="submit" id="btn">
      <span id="btn-text">Ingresar</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </form>

  <div class="divider">o</div>

  <a href="/auth/google" class="btn-google">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908C16.658 14.121 17.64 11.82 17.64 9.2z" fill="#4285F4"/>
      <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
      <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
      <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
    </svg>
    Continuar con Google
  </a>

  <p style="margin-top:16px;font-size:11px;color:var(--rima-text-faintest);line-height:1.5;text-align:center">
    Pruebas: <code style="color:var(--rima-text-muted)">basico@test.com</code> (PB · Basic) · <code style="color:var(--rima-text-muted)">pro@test.com</code> (SM · Pro) · <code style="color:var(--rima-text-muted)">max@test.com</code> (TS · Max)<br>contraseña: <code style="color:var(--rima-text-muted)">uno</code>
  </p>
  <div class="footer">RIMA AI &copy; 2024 &mdash; Marketing Intelligence</div>
</div>

<script>
(function () {
  var btn = document.getElementById('rima-theme-toggle');
  var moon = btn.querySelector('.icon-moon');
  var sun = btn.querySelector('.icon-sun');
  function currentTheme() { return document.documentElement.getAttribute('data-theme') || 'dark'; }
  function paint(mode) {
    if (moon) moon.style.display = mode === 'light' ? 'none' : '';
    if (sun) sun.style.display = mode === 'light' ? '' : 'none';
  }
  paint(currentTheme());
  btn.addEventListener('click', function () {
    var next = currentTheme() === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('rima-theme', next); } catch (e) {}
    document.documentElement.setAttribute('data-theme', next);
    paint(next);
  });
})();

document.getElementById('toggle-password').addEventListener('click', function () {
  const input = document.getElementById('password');
  const btn = this;
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.title = showing ? 'Mostrar contraseña' : 'Ocultar contraseña';
  btn.setAttribute('aria-label', btn.title);
  document.getElementById('eye-icon').innerHTML = showing
    ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>'
    : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 4.22-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
});

async function handleLogin(e) {
  e.preventDefault();
  const btn      = document.getElementById('btn');
  const btnText  = document.getElementById('btn-text');
  const spinner  = document.getElementById('spinner');
  const errorMsg = document.getElementById('error-msg');

  btn.disabled    = true;
  btnText.style.display = 'none';
  spinner.style.display = 'block';
  errorMsg.classList.remove('show');

  const email    = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
      credentials: 'include',
    });

    if (res.ok) {
      const data = await res.json();
      window.location.href = data.redirect || '/';
    } else {
      errorMsg.classList.add('show');
    }
  } catch {
    errorMsg.textContent = 'Error de conexion. Intenta de nuevo.';
    errorMsg.classList.add('show');
  } finally {
    btn.disabled = false;
    btnText.style.display = 'block';
    spinner.style.display = 'none';
  }
}
</script>
</body>
</html>
